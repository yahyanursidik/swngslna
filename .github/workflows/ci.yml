name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run check
      - name: Build (non-production, noindex)
        run: npm run build
      - name: Verify dist (links, anchors, SEO, a11y structure, ID/EN parity)
        run: npm run verify
